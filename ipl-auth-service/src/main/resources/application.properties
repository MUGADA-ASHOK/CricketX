spring.application.name=ipl-auth-service
server.port=8081

# ---------------------------------------------------------------------------
# Database (never hardcode real credentials - override via env vars in prod)
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgresql123}

# Schema is owned by Flyway migrations, never by Hibernate auto-DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Redis (access-token blocklisting on logout)
# ---------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ---------------------------------------------------------------------------
# JWT Asymmetric RS256 Key Configuration
# Auth Service holds both Private Key (to sign) and Public Key (to verify).
# Gateway and downstream microservices only receive the Public Key.
# ---------------------------------------------------------------------------
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.public-key=${JWT_PUBLIC_KEY:}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.access-token-renewal-threshold=${JWT_ACCESS_TOKEN_RENEWAL_THRESHOLD:180000}

bcci.username=${BCCI_USERNAME:bcci@123}
bcci.email=${BCCI_EMAIL:bcci.official@gmail.com}
