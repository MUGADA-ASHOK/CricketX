spring.application.name=api-gateway
server.port=8090

# ---------------------------------------------------------------------------
# Downstream service URLs - static for now, no service discovery yet.
# ---------------------------------------------------------------------------
services.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}
services.event-url=${EVENT_SERVICE_URL:http://localhost:8082}
services.order-url=${ORDER_SERVICE_URL:http://localhost:8083}

# ---------------------------------------------------------------------------
# JWT Asymmetric RS256 Verification: Gateway ONLY requires the RSA Public Key.
# It can never forge tokens, but verifies authentic tokens from ipl-auth-service.
# ---------------------------------------------------------------------------
jwt.public-key=${JWT_PUBLIC_KEY:}

# ---------------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---------------------------------------------------------------------------
# Actuator - health only
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
