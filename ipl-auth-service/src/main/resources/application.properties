spring.application.name=ipl-auth-service
server.port=8081

# ---------------------------------------------------------------------------
# Database (never hardcode real credentials - override via env vars in prod)
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgresql123}

# Schema is owned by Flyway migrations, never by Hibernate auto-DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Redis (access-token blocklisting on logout)
# ---------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ---------------------------------------------------------------------------
# JWT
# jwt.secret MUST be overridden via the JWT_SECRET env var in any real
# environment. This default is only for local development and is
# intentionally not a "real" secret.
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:local-dev-only-secret-please-override-me-with-256-bit-random-value}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.access-token-renewal-threshold=${JWT_ACCESS_TOKEN_RENEWAL_THRESHOLD:180000}
bcci.username=${BCCI_USERNAME:bcci@123}
bcci.email=${BCCI_EMAIL:bcci.official@gmail.com}
bcci.password=${BCCI_PASSWORD:bcc@virat@123}