spring.application.name=ipl-order-service

server.port=8083

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgresql123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# JWT Asymmetric RS256 Verification
# Order Service only requires the RSA Public Key to verify tokens.
# ---------------------------------------------------------------------------
jwt.public-key=${JWT_PUBLIC_KEY:}

# ---------------------------------------------------------------------------
# Kafka Consumer
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=ipl-order-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=1000

# ---------------------------------------------------------------------------
# Razorpay Payment Gateway Configuration
# ---------------------------------------------------------------------------
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_1DP5mmOlF5G5ag}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:s15r8gPZk2R2gB7a1s5F7w1Q}
razorpay.currency=${RAZORPAY_CURRENCY:INR}