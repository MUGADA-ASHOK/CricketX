spring.application.name=ipl-event-service

server.port=8082

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/event_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgresql123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# JWT Asymmetric RS256 Verification
# Event Service only requires the RSA Public Key.
# ---------------------------------------------------------------------------
jwt.public-key=${JWT_PUBLIC_KEY:}

# ---------------------------------------------------------------------------
# Kafka
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=1000

# ---------------------------------------------------------------------------
# TicketOpeningScheduler poll interval (ms)
# ---------------------------------------------------------------------------
ticket-opening.check-interval-ms=${TICKET_OPENING_CHECK_INTERVAL_MS:60000}
