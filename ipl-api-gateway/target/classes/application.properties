spring.application.name=api-gateway
server.port=8090

# ---------------------------------------------------------------------------
# Downstream service URLs - static for now, no service discovery yet.
# Auth Service port confirmed from its own application.properties
# (server.port=8081). Event/Order ports are assumed per the task doc since
# neither service has been implemented/configured yet - update these if
# their actual configured ports differ once they exist.
# ---------------------------------------------------------------------------
services.auth-url=${AUTH_SERVICE_URL:http://localhost:8081}
services.event-url=${EVENT_SERVICE_URL:http://localhost:8082}
services.order-url=${ORDER_SERVICE_URL:http://localhost:8083}

# ---------------------------------------------------------------------------
# JWT validation - this MUST be the exact same value as ipl-auth-service's
# JWT_SECRET env var. Both services validate the same HMAC-signed access
# tokens; the Gateway never issues or refreshes tokens itself.
# The default below intentionally matches ipl-auth-service's local-dev
# default so the two services interoperate out of the box without any
# env vars set - still override both with the SAME real secret in any
# non-local environment.
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:local-dev-only-secret-please-override-me-with-256-bit-random-value}

# ---------------------------------------------------------------------------
# CORS - comma-separated list of allowed origins. No frontend exists yet;
# change this when one does. Never combine allowedOrigins=* with credentials.
# ---------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ---------------------------------------------------------------------------
# Actuator - health only, nothing sensitive exposed publicly.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
